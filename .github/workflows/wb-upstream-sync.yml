name: wb-upstream-sync

# Follows umputun/tg-spam releases with no one involved. Once a day it merges the newest
# upstream release tag into master, checks the result the way wb-image.yml checks a pull
# request, pushes it and starts wb-image.yml, which publishes the image and redeploys both
# stacks.
#
# The merge itself cannot conflict: every upstream file is untouched in this fork, ours live in
# deploy/wb-compat, docker-compose.portainer.yml and .github/workflows/wb-*.yml (README.md in
# deploy/wb-compat explains why). The one exception is .github/workflows: upstream's workflows
# are not kept here, and GITHUB_TOKEN may not push a change to any workflow file, so the merge
# drops whatever upstream changed there.
#
# What can go wrong is a patch from deploy/wb-compat/patches that no longer applies, a failing
# test, or an option the stacks set that the release renamed. Then nothing reaches master: the
# run fails (GitHub mails whoever last changed this file) and the merge waits on the branch
# sync/upstream-<tag> to be fixed by hand, see "Updating from upstream" in the README.

on:
  schedule:
    - cron: "23 4 * * *" # 07:23 Moscow, every day
  workflow_dispatch:
    inputs:
      tag:
        description: upstream tag to merge, the latest release when empty
        required: false

permissions:
  contents: write # push the merge to master, or to the sync branch when it fails
  actions: write # start wb-image.yml

concurrency:
  group: wb-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: find the release to merge
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          set -eu
          tag=${WANTED:-$(gh api repos/umputun/tg-spam/releases/latest --jq .tag_name)}
          git fetch --no-tags https://github.com/umputun/tg-spam.git "refs/tags/$tag:refs/tags/$tag"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "master already contains $tag"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "merging $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: merge it
        id: merge
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit "$TAG" || true
          # .github/workflows keeps only this fork's own workflows, as they are in master
          for f in $( { git diff --name-only --diff-filter=U -- .github/workflows
                        git diff --cached --name-only HEAD -- .github/workflows; } | sort -u); do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git checkout HEAD -- "$f"
            else
              git rm -q -f --cached --ignore-unmatch -- "$f"
              rm -f -- "$f"
            fi
          done
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ -n "$conflicts" ]; then
            echo "::error::$TAG conflicts with this fork in: $conflicts"
            exit 1
          fi
          git commit -q -m "Merge upstream $TAG"
          git log --oneline -1

      - name: check rendered stack config
        if: steps.merge.outcome == 'success'
        run: sh deploy/wb-compat/check-stack-config.sh

      - name: test patched packages
        if: steps.merge.outcome == 'success'
        run: sh deploy/wb-compat/test-image-tree.sh

      - name: build the image and check the options the stacks set
        if: steps.merge.outcome == 'success'
        run: |
          set -eu
          IMAGE=tg-spam-wb:sync sh deploy/wb-compat/build-image.sh
          sh deploy/wb-compat/check-image-options.sh tg-spam-wb:sync

      - name: push to master and deploy
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git push origin HEAD:master
          gh workflow run wb-image.yml --ref master

      - name: keep the failed merge for a human
        if: failure() && steps.merge.outcome == 'success'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git push --force origin "HEAD:refs/heads/sync/upstream-$TAG"
          echo "::error::$TAG merged but failed the checks, nothing was deployed; the merge is on sync/upstream-$TAG"
