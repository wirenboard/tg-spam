name: wb-upstream-sync

# Prepares each new umputun/tg-spam release and leaves the decision to a person. Once a day
# it merges the newest upstream release tag into a branch off master, pushes it as
# sync/upstream-<tag>, starts wb-image.yml on it and opens a pull request. wb-image.yml runs
# the checks every branch gets: rendered stack config, upstream files untouched, the tests of
# the patched packages, the image build, the options the stacks set. Merging the pull request
# publishes the image and redeploys both stacks; closing it declines the release.
#
# The merge itself cannot conflict: every upstream file is untouched in this fork, ours live
# in deploy/wb-compat, docker-compose.portainer.yml and .github/workflows/wb-*.yml (see
# "What is ours" in deploy/wb-compat/README.md). The one exception is .github/workflows:
# upstream's workflows are not kept here, and GITHUB_TOKEN may not push a change to any
# workflow file, so the merge drops whatever upstream changed there.
#
# A push or a pull request made with GITHUB_TOKEN starts no workflow, hence the explicit
# workflow_dispatch of wb-image.yml on the branch.

on:
  schedule:
    - cron: "23 4 * * *" # 07:23 Moscow, every day
  workflow_dispatch:
    inputs:
      tag:
        description: upstream tag to propose, the latest release when empty
        required: false

permissions:
  contents: write # push the sync branch
  pull-requests: write # open its pull request
  actions: write # start wb-image.yml on it

concurrency:
  group: wb-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: find the release to propose
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          set -eu
          tag=${WANTED:-$(gh api repos/umputun/tg-spam/releases/latest --jq .tag_name)}
          current=$(tr -d ' \r\n' < deploy/wb-compat/UPSTREAM_VERSION)
          if [ "$tag" = "$current" ]; then
            echo "master is on $tag already"
          elif git ls-remote --exit-code --heads origin "sync/upstream-$tag" > /dev/null; then
            # an open pull request waits for a decision, or a closed one declined the release
            echo "$tag was proposed already, on sync/upstream-$tag"
          else
            echo "proposing $tag, master is on $current"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: merge it into the sync branch
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --no-tags https://github.com/umputun/tg-spam.git "refs/tags/$TAG:refs/tags/$TAG"
          git checkout -q -b "sync/upstream-$TAG"

          # a squash merge of an earlier sync pull request leaves master with the files of the
          # release it is on but not its history, and the merge below would replay that release
          # as conflicts. With the files checked to be exactly that release, recording it as
          # merged is the truth
          current=$(tr -d ' \r\n' < deploy/wb-compat/UPSTREAM_VERSION)
          sh deploy/wb-compat/check-upstream-files.sh
          if ! git merge-base --is-ancestor "$current" HEAD; then
            git merge -q -s ours --no-edit -m "Record upstream $current as merged" "$current"
          fi

          git merge --no-ff --no-commit "$TAG" || true
          # .github/workflows keeps only this fork's own workflows, as they are in master
          for f in $( { git diff --name-only --diff-filter=U -- .github/workflows
                        git diff --cached --name-only HEAD -- .github/workflows; } | sort -u); do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git checkout HEAD -- "$f"
            else
              git rm -q -f --cached --ignore-unmatch -- "$f"
              rm -f -- "$f"
            fi
          done
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ -n "$conflicts" ]; then
            echo "::error::$TAG conflicts with this fork in: $conflicts"
            exit 1
          fi
          echo "$TAG" > deploy/wb-compat/UPSTREAM_VERSION
          git add deploy/wb-compat/UPSTREAM_VERSION
          git commit -q -m "Merge upstream $TAG"
          git push -q origin "HEAD:refs/heads/sync/upstream-$TAG"

      - name: check it and open the pull request
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          branch="sync/upstream-$TAG"
          gh workflow run wb-image.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          body="Upstream release [$TAG](https://github.com/umputun/tg-spam/releases/tag/$TAG), merged by wb-upstream-sync.yml.

          - wb-image.yml checks this branch: stack config, upstream files, the tests of the patched packages, the image build, the options the stacks set. Merge only when it is green.
          - Merging publishes the image and redeploys both stacks. Prefer **Create a merge commit**; a squash merge also works.
          - To decline the release, close this pull request and keep the branch.
          - Red checks: deploy/wb-compat/README.md, \"Updating from upstream\", says how to refresh a patch on this branch."
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" \
            --title "Merge upstream $TAG" --body "$body"; then
            echo "::error::the pull request could not be opened (GitHub Actions may not be allowed to create pull requests here); open it by hand: https://github.com/$GITHUB_REPOSITORY/compare/master...$branch"
            exit 1
          fi
